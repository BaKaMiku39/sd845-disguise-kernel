name: Build dipper kernel

# 触发方式：仓库 Actions 页面手动 Run workflow
# 产物：dipper-kernel-<日期>.zip（AnyKernel3 格式，可直接在 TWRP 里刷）
# 说明：所有补丁步骤都写在本文件里，仓库不存放大体积内核源码

on:
  workflow_dispatch:

env:
  OUT_DIR: ${{ github.workspace }}/out
  CC_BIN: clang13/clang/host/linux-x86/clang-r428724/bin/clang
  CROSS: clang13/linaro-gcc-4.9/aarch64-linux-gnu/bin/aarch64-linux-gnu-
  CROSS32: clang13/linaro-gcc-4.9/arm-linux-gnueabi/bin/arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip wget zstd patch \
            libssl-dev libfl-dev python3 libarchive-tools

      - name: Clone AnyKernel3
        run: git clone --depth=1 -b master https://github.com/diyishengqing/AnyKernel3 AnyKernel3

      - name: Clone kernel source (MIUI Android 10 base)
        run: git clone --depth=1 -b 88-zstd https://github.com/diyishengqing/Xiaomi_Kernel_OpenSource-sdm845 kernel

      - name: Clone toolchain
        run: |
          git clone --depth=1 -b clang13 https://github.com/diyishengqing/android-kernel-tools clang13
          echo "$PWD/clang13/bin" >> "$GITHUB_PATH"

      - name: Integrate BakaSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/v4.2.0-rc3/kernel/setup.sh" | bash -s v4.2.0-rc3
          ls -1d drivers/kernelsu

      - name: Strip legacy KernelSU hooks (restore upstream 4.9 shape)
        run: |
          python3 - <<'PY'
          import re
          files = ['fs/exec.c', 'fs/open.c', 'fs/stat.c', 'fs/read_write.c',
                   'drivers/input/input.c', 'fs/namei.c', 'kernel/sys.c']
          decl = re.compile(r'(?m)^extern int ksu_handle_\w+\([^;]*\);\n')
          call = re.compile(r'(?m)^[ \t]*ksu_handle_\w+\([^;\n]*\);[ \t]*\n')
          for f in files:
              p = 'kernel/' + f
              s = open(p, encoding='utf-8', errors='replace').read()
              n1, n2 = len(decl.findall(s)), len(call.findall(s))
              s = decl.sub('', s)
              s = call.sub('', s)
              s = re.sub(r'\n{3,}', '\n\n', s)
              open(p, 'w', encoding='utf-8').write(s)
              print(f'{f}: removed {n1} legacy extern(s), {n2} legacy call(s)')
          PY

      - name: Fetch SUSFS 4.9 files
        run: |
          set -eux
          mkdir -p susfs
          B=https://raw.githubusercontent.com/wxx9248/susfs4ksu/kernel-4.9-v2/kernel_patches
          curl -fsSL "$B/50_add_susfs_in_kernel-4.9.patch" -o susfs/patch.patch
          curl -fsSL "$B/fs/susfs.c"                -o susfs/susfs.c
          curl -fsSL "$B/include/linux/susfs.h"     -o susfs/susfs.h
          curl -fsSL "$B/include/linux/susfs_def.h" -o susfs/susfs_def.h
          python3 - <<'PY'
          import re
          src = open('susfs/patch.patch', encoding='utf-8', errors='replace').read()
          parts = re.split(r'(?m)^(?=diff --git )', src)
          # fs/notify/fdinfo.c 用了 4.19+ 才有的 inotify_mark_user_mask()，4.9 上不存在
          # fs/proc/cmdline.c 在小米树里是精简版，补丁靠 fuzz 会插错位置，改为手工插入
          drop = ('a/fs/notify/fdinfo.c ', 'a/fs/proc/cmdline.c ')
          keep, dropped = [], []
          for p in parts:
              if not p.startswith('diff --git '):
                  keep.append(p); continue
              if any(d in p.splitlines()[0] for d in drop):
                  dropped.append(p.splitlines()[0].split(' b/')[-1])
              else:
                  keep.append(p)
          out = ''.join(keep)
          open('susfs/patch.patch','w',encoding='utf-8').write(out)
          print('dropped:', dropped, 'hunks kept:', out.count('\n@@'))
          PY
          wc -l susfs/*
          cp -v susfs/susfs.c kernel/fs/
          cp -v susfs/susfs.h susfs/susfs_def.h kernel/include/linux/

      - name: Apply SUSFS patch
        run: |
          cd kernel
          set +e
          patch -p1 --batch --forward --fuzz=3 < ../susfs/patch.patch > /tmp/p.log 2>&1
          rc=$?
          echo "patch exit=$rc"
          grep -E "FAILED|Reversed|can't find|malformed" /tmp/p.log || echo "(no rejects)"
          if [ $rc -ne 0 ]; then find . -name '*.rej' | head -20; exit 1; fi
          echo "=== sanity: hook presence ==="
          grep -c "ksu_handle_faccessat" fs/open.c
          grep -c "ksu_handle_stat" fs/stat.c
          grep -c "ksu_handle_execveat" fs/exec.c

      - name: Patch cmdline spoof manually
        run: |
          python3 - <<'PY'
          p = 'kernel/fs/proc/cmdline.c'
          s = open(p, encoding='utf-8', errors='replace').read()
          anchor = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
          assert anchor in s, 'anchor not found'
          body = (
              '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
              '\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n'
              '\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n'
              '\t\treturn 0;\n'
              '\t}\n'
              '#endif\n'
          )
          s = s.replace(anchor, anchor + body, 1)
          top = '#include <linux/seq_file.h>\n'
          assert top in s, 'include anchor not found'
          decl = (
              '\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
              'extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n'
              'extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n'
              '#endif\n'
          )
          s = s.replace(top, top + decl, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Configure defconfig
        working-directory: kernel
        run: |
          CFG=arch/arm64/configs/dipper_user_defconfig
          sed -i '/^CONFIG_KSU/d;/^# CONFIG_KSU/d' "$CFG"
          sed -i '/^CONFIG_LOCALVERSION/d;/^# CONFIG_LOCALVERSION/d' "$CFG"
          sed -i '/^CONFIG_IKCONFIG/d;/^# CONFIG_IKCONFIG/d' "$CFG"
          {
            echo 'CONFIG_KSU=y'
            echo 'CONFIG_KPROBES=y'
            echo 'CONFIG_HAVE_KPROBES=y'
            echo 'CONFIG_KPROBE_EVENTS=y'
            echo 'CONFIG_KSU_SUSFS=y'
            echo 'CONFIG_KSU_SUSFS_SUS_PATH=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
            echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
            echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MAP=y'
            echo 'CONFIG_LOCALVERSION="-perf-g3f9c1a7"'
            echo '# CONFIG_LOCALVERSION_AUTO is not set'
            echo '# CONFIG_IKCONFIG is not set'
            echo '# CONFIG_IKCONFIG_PROC is not set'
          } >> "$CFG"
          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion
          tail -20 "$CFG"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          # 1) 去掉 .git：setlocalversion 在脏树上会追加 '+'，删掉后版本串干净
          rm -rf .git
          # 2) 伪造构建者信息，避免 /proc/version 出现 CI 的 runner@runnervmxxx
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="xiaomi"
          export KBUILD_BUILD_TIMESTAMP="Fri Jul  9 22:14:31 CST 2021"
          mkdir -p "$OUT_DIR"
          ARGS="-j$(nproc) O=$OUT_DIR ARCH=arm64 CC=$GITHUB_WORKSPACE/$CC_BIN CROSS_COMPILE=$GITHUB_WORKSPACE/$CROSS CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/$CROSS32 KCFLAGS=-Wno-declaration-after-statement"
          make $ARGS dipper_user_defconfig
          echo "=== key configs ==="
          grep -E "CONFIG_KSU_SUSFS=y|CONFIG_KSU=y" "$OUT_DIR/.config"
          echo "=== kernelrelease ==="
          make $ARGS kernelrelease
          echo "=== full build ==="
          set +e
          make $ARGS > /tmp/build.log 2>&1
          rc=$?
          echo "build exit=$rc"
          echo "=== COMPILE ERRORS ==="
          grep -nE "error:|fatal error|undefined reference" /tmp/build.log | head -40 || echo "(none)"
          echo "=== LAST 50 ==="
          tail -50 /tmp/build.log
          exit $rc

      - name: Pack AnyKernel3
        run: |
          ls -l "$OUT_DIR/arch/arm64/boot/"
          cp "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" AnyKernel3/
          cd AnyKernel3
          zip -q -r "$GITHUB_WORKSPACE/sd845-kernel-$(date +%Y%m%d).zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd845-kernel
          path: sd845-kernel-*.zip
          retention-days: 7
